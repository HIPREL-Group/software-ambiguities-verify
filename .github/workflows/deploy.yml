name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - name: Write Firebase web config
        # .env.production is gitignored, so CI reconstructs it from repository
        # variables (Settings -> Secrets and variables -> Actions -> Variables).
        run: |
          cat > .env.production <<'ENVEOF'
          VITE_FIREBASE_API_KEY=AIzaSyA835NIEP6JviqiS54DyVZP3peYcd17xe4
          VITE_FIREBASE_AUTH_DOMAIN=software-ambi.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=software-ambi
          VITE_FIREBASE_STORAGE_BUCKET=software-ambi.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID=567168952202
          VITE_FIREBASE_APP_ID=1:567168952202:web:100104feb83aed5fae4a73
          ENVEOF

      - run: npm run build

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
