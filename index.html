<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>software-ambiguities-verify</title>
</head>

<body>
  <!-- <div id="app"></div> -->
  <main class="auth-page">
    <h1>Software Ambiguities</h1>

    <form id="auth-form">
      <label>
        Email
        <input id="email" type="email" required autocomplete="email" />
      </label>

      <label>
        Password
        <input id="password" type="password" required minlength="6" autocomplete="current-password" />
      </label>

      <button type="submit">Log in</button>
      <button type="button" id="sign-up-button">Create account</button>
    </form>

    <section id="signed-in-view" hidden>
      <p id="user-email"></p>
      <button id="log-out-button">Log out</button>
    </section>

    <p id="message" aria-live="polite"></p>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
